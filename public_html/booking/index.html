<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Онлайн-запис — Dr. Gomon Cosmetology</title>
<meta name="description" content="Запис на процедуру до Dr. Gomon Cosmetology">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a96e;--gold-dim:#a07d48;--gold-pale:#e8d5b0;
  --bg:#111010;--bg2:#1a1918;--surface:#252422;--surface2:#2e2c2a;
  --border:#333130;--border-gold:rgba(201,169,110,.25);
  --text:#f5f1ea;--text2:#b8b0a5;--text3:#a89a8c;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',sans-serif;
  --err:#c96e6e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-weight:300;line-height:1.5;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 56px}

header{text-align:center;padding:12px 0 22px}
header h1{font-family:var(--serif);font-weight:300;font-size:30px;margin:0 0 4px;letter-spacing:.5px}
header p{margin:0;color:var(--text3);font-size:13px;letter-spacing:1.5px;text-transform:uppercase}

.steps{display:flex;gap:6px;margin:0 0 22px}
.steps i{flex:1;height:2px;background:var(--border);border-radius:2px;transition:background .25s}
.steps i.on{background:var(--gold)}

h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 14px}
.back{background:none;border:0;color:var(--text3);font-family:var(--sans);
  font-size:13px;padding:6px 0;cursor:pointer;margin-bottom:6px}
.back:hover{color:var(--gold)}

.card{width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;
  color:inherit;font:inherit;transition:border-color .2s,background .2s;display:block}
.card:hover,.card:focus-visible{border-color:var(--border-gold);background:var(--surface2);outline:none}
.card .nm{font-size:16px;margin-bottom:3px}
.card .meta{color:var(--gold);font-size:14px}
.card .dur{color:var(--text3);font-size:13px;margin-left:8px}
.card .drugs{color:var(--text3);font-size:12.5px;margin-top:7px;line-height:1.45}

/* теки процедур */
.cat{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.cat>button{width:100%;display:flex;align-items:center;justify-content:space-between;
  gap:10px;background:var(--surface);border:0;padding:15px 16px;color:inherit;
  font:inherit;font-size:16px;cursor:pointer;text-align:left}
.cat>button:hover{background:var(--surface2)}
.cat .cnt{color:var(--text3);font-size:13px;margin-left:auto;margin-right:4px}
.cat .arw{color:var(--gold);font-size:12px;transition:transform .2s;flex:none}
.cat.open .arw{transform:rotate(90deg)}
.cat .inner{display:none;padding:10px 10px 2px;background:var(--bg2)}
.cat.open .inner{display:block}
.cat .card{background:var(--bg);margin-bottom:8px}

.day{margin-bottom:18px}
.day h3{font-size:14px;font-weight:400;color:var(--text2);margin:0 0 8px;text-transform:capitalize}
.slots{display:flex;flex-wrap:wrap;gap:7px}
.slot{background:var(--surface);border:1px solid var(--border);border-radius:9px;
  padding:9px 13px;font:inherit;font-size:14px;color:var(--text);cursor:pointer;
  transition:border-color .2s,background .2s}
.slot:hover,.slot:focus-visible{border-color:var(--gold);background:var(--surface2);outline:none}
.closed{color:var(--text3);font-size:13px;font-style:italic}

input{width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:13px 14px;color:var(--text);font:inherit;font-size:16px;
  margin-bottom:10px}
input:focus{outline:none;border-color:var(--gold)}
label{display:block;font-size:13px;color:var(--text3);margin:0 0 6px}
.btn{width:100%;background:var(--gold);border:0;border-radius:10px;padding:14px;
  font:inherit;font-size:15px;font-weight:400;color:#1a1612;cursor:pointer;margin-top:4px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--text2)}

.hello{background:var(--bg2);border:1px solid var(--border-gold);border-radius:12px;
  padding:12px 16px;margin-bottom:18px;font-size:14px}
.hello b{font-weight:400;color:var(--gold)}

.summary{background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;margin-bottom:18px;font-size:14px;line-height:1.75}
.summary b{font-weight:400;color:var(--gold)}
.err{color:var(--err);font-size:13.5px;margin:10px 0 0}
.muted{color:var(--text3);font-size:13px}
.spin{text-align:center;color:var(--text3);padding:30px 0;font-size:14px}
.ok{text-align:center;padding:26px 0}
.ok .tick{font-size:42px;color:var(--gold);line-height:1}
.ok h2{margin:14px 0 8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Dr. Gomon</h1>
    <p>Онлайн-запис</p>
  </header>
  <div class="steps"><i id="s1"></i><i id="s2"></i><i id="s3"></i><i id="s4"></i></div>
  <main id="view"></main>
</div>

<script>
'use strict';
var API = '/api';
var state = {token:null, phone:'', first:'', last:'', known:false,
             services:[], service:null, specialist:null, date:null, time:null};

var view = document.getElementById('view');
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function step(n){for(var i=1;i<=4;i++){document.getElementById('s'+i).className=(i<=n?'on':'');}}
function show(html){view.innerHTML=html;window.scrollTo(0,0);}
function spin(t){show('<div class="spin">'+esc(t||'Завантаження…')+'</div>');}
function err(msg){var e=document.getElementById('e');if(e){e.textContent=msg;e.hidden=false;}}
function busy(id,on,label){var b=document.getElementById(id);if(!b)return;
  b.disabled=on;if(label)b.textContent=label;}

function api(path, opts){
  opts = opts || {};
  var ctl = new AbortController();
  var timer = setTimeout(function(){ctl.abort();}, 30000);
  opts.signal = ctl.signal;
  opts.headers = opts.headers || {};
  if (opts.body) opts.headers['Content-Type'] = 'application/json';
  if (state.token) opts.headers['Authorization'] = 'Bearer ' + state.token;
  return fetch(API + path, opts).then(function(r){
    clearTimeout(timer);
    return r.json().catch(function(){return {};}).then(function(j){
      return {ok: r.ok, status: r.status, data: j};
    });
  });
}

/* ── 1. Телефон ────────────────────────────────────────────────────────── */
function normPhone(raw){
  var d = (raw || '').replace(/\D/g, '');
  if (d.length === 10 && d.charAt(0) === '0') return '38' + d;
  if (d.length === 9) return '380' + d;
  if (d.length === 12 && d.slice(0, 3) === '380') return d;
  return null;
}

function renderPhone(){
  step(1);
  show('<h2>Вітаємо</h2>' +
       '<p class="muted" style="margin:-6px 0 16px">Почнемо з номера телефону — ' +
       'якщо ви вже були у нас, підставимо ваші дані.</p>' +
       '<label for="ph">Телефон</label>' +
       '<input id="ph" type="tel" inputmode="tel" placeholder="0XX XXX XX XX" ' +
         'autocomplete="tel" value="' + esc(state.phone.replace(/^38/, '')) + '">' +
       '<button class="btn" id="go">Отримати код</button>' +
       '<p class="err" id="e" hidden></p>');
  document.getElementById('go').onclick = sendOtp;
  document.getElementById('ph').focus();
}

function sendOtp(){
  var phone = normPhone(document.getElementById('ph').value);
  if (!phone) return err('Перевірте номер телефону');
  state.phone = phone;
  busy('go', true, 'Надсилаємо…');
  api('/auth/send-otp', {method:'POST',
                         body: JSON.stringify({phone: phone, purpose: 'booking'})})
    .then(function(r){
      busy('go', false, 'Отримати код');
      if (r.status === 429) return err('Забагато спроб. Спробуйте за годину.');
      if (!r.ok) return err('Не вдалося надіслати код. Спробуйте пізніше.');
      renderCode();
    }).catch(function(){
      busy('go', false, 'Отримати код');
      err('Немає звʼязку. Спробуйте ще раз.');
    });
}

function renderCode(){
  step(1);
  show('<button class="back" id="bk">← Змінити номер</button>' +
       '<h2>Код підтвердження</h2>' +
       '<p class="muted" style="margin:-6px 0 16px">Надіслали код на ' +
         esc('0' + state.phone.slice(3)) + '</p>' +
       '<label for="cd">Код із повідомлення</label>' +
       '<input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6">' +
       '<button class="btn" id="go">Підтвердити</button>' +
       '<p class="err" id="e" hidden></p>');
  document.getElementById('bk').onclick = renderPhone;
  document.getElementById('go').onclick = verifyOtp;
  document.getElementById('cd').focus();
}

function verifyOtp(){
  var code = document.getElementById('cd').value.replace(/\D/g, '');
  if (code.length < 4) return err('Введіть код із повідомлення');
  busy('go', true, 'Перевіряємо…');
  api('/auth/verify', {method:'POST', body: JSON.stringify({phone: state.phone, code: code})})
    .then(function(r){
      if (!r.ok || !r.data.token) {
        busy('go', false, 'Підтвердити');
        return err(r.status === 429 ? 'Забагато спроб. Спробуйте пізніше.' : 'Невірний код');
      }
      state.token = r.data.token;
      return loadMe();
    }).catch(function(){
      busy('go', false, 'Підтвердити');
      err('Немає звʼязку. Спробуйте ще раз.');
    });
}

/* ── 2. Хто ви ─────────────────────────────────────────────────────────── */
function loadMe(){
  spin('Шукаємо вас у базі…');
  return api('/me').then(function(r){
    var d = r.ok ? (r.data || {}) : {};
    var first = (d.name && d.name !== 'Клієнт') ? d.name : '';
    var last = d.last_name || '';
    if (first && last) {
      state.first = first; state.last = last; state.known = true;
      loadServices();
    } else {
      state.first = first; state.last = last; state.known = false;
      renderName();
    }
  }).catch(function(){ renderName(); });
}

function renderName(){
  step(1);
  show('<h2>Як до вас звертатись?</h2>' +
       '<p class="muted" style="margin:-6px 0 16px">Ці дані підуть у вашу картку.</p>' +
       '<label for="nm">Імʼя</label><input id="nm" autocomplete="given-name" value="' + esc(state.first) + '">' +
       '<label for="ln">Прізвище</label><input id="ln" autocomplete="family-name" value="' + esc(state.last) + '">' +
       '<button class="btn" id="go">Далі</button>' +
       '<p class="err" id="e" hidden></p>');
  document.getElementById('go').onclick = function(){
    var f = document.getElementById('nm').value.trim();
    var l = document.getElementById('ln').value.trim();
    if (f.length < 2) return err('Вкажіть, будь ласка, імʼя');
    if (l.length < 2) return err('Вкажіть, будь ласка, прізвище');
    state.first = f; state.last = l;
    loadServices();
  };
}

function hello(){
  return '<div class="hello"><span>Вітаємо, <b>' + esc(state.first) + '</b></span></div>';
}

/* ── 3. Послуги ────────────────────────────────────────────────────────── */
function money(s){
  if (!s.price_from) return '';
  if (s.price_to && s.price_to !== s.price_from) return 'від ' + s.price_from + ' грн';
  return s.price_from + ' грн';
}

function loadServices(){
  step(2);
  if (state.services.length) return renderServices();
  spin();
  api('/booking/services').then(function(r){
    if (!r.ok) return show('<p class="err">Не вдалося завантажити перелік послуг. Оновіть сторінку.</p>');
    state.services = r.data;
    renderServices();
  }).catch(function(){
    show('<p class="err">Немає зв’язку. Перевірте інтернет і оновіть сторінку.</p>');
  });
}

function serviceCard(s, i){
  var drugs = '';
  if (s.drugs && s.drugs.length > 1) {
    drugs = '<div class="drugs">' + s.drugs.map(function(d){
      return esc(d.name) + ' — ' + d.price + ' грн';
    }).join(' · ') + '</div>';
  }
  return '<button class="card" data-i="' + i + '">' +
           '<div class="nm">' + esc(s.name) + '</div>' +
           '<div><span class="meta">' + esc(money(s)) + '</span>' +
           '<span class="dur">' + s.duration_min + ' хв</span></div>' + drugs +
         '</button>';
}

function renderServices(){
  step(2);
  // Порядок тек — той, у якому їх віддав сервер (ordinal з WLaunch)
  var order = [], byCat = {};
  state.services.forEach(function(s, i){
    var c = s.category || '';
    if (!(c in byCat)) { byCat[c] = []; order.push(c); }
    byCat[c].push(i);
  });

  var h = hello() + '<h2>Оберіть процедуру</h2>';
  order.forEach(function(cat){
    var idx = byCat[cat];
    if (!cat) {                          // послуги з кореня — без теки
      h += idx.map(function(i){ return serviceCard(state.services[i], i); }).join('');
      return;
    }
    h += '<div class="cat" data-cat="' + esc(cat) + '">' +
           '<button type="button"><span>' + esc(cat) + '</span>' +
           '<span class="cnt">' + idx.length + '</span>' +
           '<span class="arw">&#9654;</span></button>' +
           '<div class="inner">' +
             idx.map(function(i){ return serviceCard(state.services[i], i); }).join('') +
           '</div></div>';
  });
  show(h);

  [].forEach.call(view.querySelectorAll('.cat>button'), function(b){
    b.onclick = function(){
      var box = b.parentNode, wasOpen = box.classList.contains('open');
      [].forEach.call(view.querySelectorAll('.cat'), function(c){ c.classList.remove('open'); });
      if (!wasOpen) {                    // відкрита завжди одна — список лишається коротким
        box.classList.add('open');
        box.scrollIntoView({block:'nearest', behavior:'smooth'});
      }
    };
  });
  [].forEach.call(view.querySelectorAll('.card'), function(b){
    b.onclick = function(){ pickService(state.services[+b.dataset.i]); };
  });
}

function pickService(s){
  state.service = s; state.specialist = null;
  if (s.specialist_choice) renderSpecialists();
  else { state.specialist = s.specialists[0]; loadSlots(); }
}

/* ── 4. Спеціаліст (лише там, де є вибір) ──────────────────────────────── */
var SPEC_NAME = {victoria:'Вікторія', anastasia:'Анастасія'};

function renderSpecialists(){
  step(3);
  var h = '<button class="back" id="bk">← Процедури</button><h2>Оберіть спеціаліста</h2>';
  state.service.specialists.forEach(function(sp){
    h += '<button class="card" data-sp="' + esc(sp) + '"><div class="nm">' +
         esc(SPEC_NAME[sp] || sp) + '</div></button>';
  });
  show(h);
  document.getElementById('bk').onclick = renderServices;
  [].forEach.call(view.querySelectorAll('[data-sp]'), function(b){
    b.onclick = function(){ state.specialist = b.dataset.sp; loadSlots(); };
  });
}

/* ── 5. Дата і час ─────────────────────────────────────────────────────── */
function isoPlus(days){
  var d = new Date(); d.setDate(d.getDate() + days);
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
var WD = ['неділя','понеділок','вівторок','середа','четвер','пʼятниця','субота'];
var MN = ['січня','лютого','березня','квітня','травня','червня','липня','серпня',
          'вересня','жовтня','листопада','грудня'];
function human(iso){
  var p = iso.split('-'), d = new Date(+p[0], +p[1]-1, +p[2]);
  return +p[2] + ' ' + MN[+p[1]-1] + ', ' + WD[d.getDay()];
}

function loadSlots(){
  step(3); spin('Шукаємо вільний час…');
  var q = '?service=' + encodeURIComponent(state.service.name) +
          '&specialist=' + encodeURIComponent(state.specialist) +
          '&from=' + isoPlus(0) + '&to=' + isoPlus(14);   // горизонт запису — два тижні
  api('/booking/slots' + q).then(function(r){
    if (!r.ok) return show('<p class="err">Не вдалося завантажити розклад. Спробуйте пізніше.</p>');
    renderSlots(r.data);
  }).catch(function(){
    show('<p class="err">Немає зв’язку. Спробуйте пізніше.</p>');
  });
}

function renderSlots(days){
  step(3);
  var h = '<button class="back" id="bk">← Назад</button><h2>' + esc(state.service.name) + '</h2>';
  var any = false;
  days.forEach(function(d){
    var times = (d.specialists || {})[state.specialist] || [];
    if (!times.length) return;
    any = true;
    h += '<div class="day"><h3>' + esc(human(d.date)) + '</h3><div class="slots">' +
         times.map(function(t){
           return '<button class="slot" data-d="' + d.date + '" data-t="' + t + '">' + t + '</button>';
         }).join('') + '</div></div>';
  });
  if (!any) {
    h += '<p class="closed">На найближчі дні вільного часу немає.</p>' +
         '<p class="muted">Розклад відкривається поступово — зазирніть за кілька днів ' +
         'або напишіть нам у Telegram чи Instagram, і ми підберемо час.</p>';
  }
  show(h);
  document.getElementById('bk').onclick = function(){
    if (state.service.specialist_choice) renderSpecialists(); else renderServices();
  };
  [].forEach.call(view.querySelectorAll('.slot'), function(b){
    b.onclick = function(){ state.date = b.dataset.d; state.time = b.dataset.t; renderConfirm(); };
  });
}

/* ── 6. Підтвердження ──────────────────────────────────────────────────── */
function summary(){
  return '<div class="summary">' +
    '<div><b>' + esc(state.service.name) + '</b></div>' +
    '<div>' + esc(human(state.date)) + ' о ' + esc(state.time) + '</div>' +
    '<div>' + esc(SPEC_NAME[state.specialist] || state.specialist) +
      ' · ' + state.service.duration_min + ' хв' +
      (money(state.service) ? ' · ' + esc(money(state.service)) : '') + '</div>' +
    '<div class="muted">' + esc(state.first + ' ' + state.last) +
      ' · ' + esc('0' + state.phone.slice(3)) + '</div>' +
    '</div>';
}

function renderConfirm(){
  step(4);
  show('<button class="back" id="bk">← Інший час</button>' +
       '<h2>Перевірте запис</h2>' + summary() +
       '<button class="btn" id="go">Підтвердити запис</button>' +
       '<p class="err" id="e" hidden></p>');
  document.getElementById('bk').onclick = loadSlots;
  document.getElementById('go').onclick = submit;
}

function submit(){
  busy('go', true, 'Записуємо…');
  api('/booking/create', {method:'POST', body: JSON.stringify({
    first_name: state.first, last_name: state.last,
    service: state.service.name, specialist: state.specialist,
    date: state.date, time: state.time, source: 'web'
  })}).then(function(b){
    if (b.ok) return renderDone();
    busy('go', false, 'Підтвердити запис');
    var code = (b.data || {}).error;
    if (code === 'slot_taken' || code === 'conflict') {
      err('Цей час щойно зайняли. Показуємо вільні…');
      setTimeout(loadSlots, 1400);
    } else if (code === 'surname_required' || code === 'name_required') {
      err('Потрібні імʼя та прізвище');
      setTimeout(renderName, 1200);
    } else {
      err((b.data || {}).detail || 'Не вдалося створити запис. Спробуйте інший час.');
    }
  }).catch(function(){
    busy('go', false, 'Підтвердити запис');
    err('Немає звʼязку. Спробуйте ще раз.');
  });
}

function renderDone(){
  step(4);
  show('<div class="ok"><div class="tick">✓</div><h2>Записано</h2>' + summary() +
       '<p class="muted">Нагадаємо напередодні. Якщо плани зміняться — ' +
       'скасувати запис можна в нашому застосунку.</p>' +
       '<a class="btn ghost" style="display:block;text-align:center;text-decoration:none;' +
       'margin-top:14px" href="/app/">Відкрити застосунок</a></div>');
}

renderPhone();
</script>
</body>
</html>
