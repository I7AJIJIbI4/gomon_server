name: pytest

# Без фільтра шляхів: він запускав тести лише на 5 файлів і пропускав зміни в
# photo_reminder, notifier, booking, booking_slots, wl_catalog, appt_reminder,
# хоча тести на них є. Набір проходить за секунди — ганяємо на кожен push.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install flask flask-cors pytest requests

      - name: Run pytest
        run: pytest tests/ -v --tb=short
